<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Web CEPDECO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1a365d;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #555;
        }
        .badge {
            display: inline-block;
            background-color: #2b6cb0;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portal Web CEPDECO</h1>
        <p>¡Hola Mundo! El entorno base del proyecto ya está funcionando.</p>
        <span class="badge">Entorno de Desarrollo (Staging)</span>
    </div>
</body>
</html>
